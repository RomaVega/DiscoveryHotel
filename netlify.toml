[build]
  command = "npm run build"
  publish = "out"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # google-analytics.com / googletagmanager.com entries are for GA4 (gtag.js)
    # and Google Tag Manager: script-src loads the tag and gtm.js, connect-src is
    # where they POST hits, frame-src is GTM's <noscript> ns.html iframe.
    # A tag added inside the GTM container that calls a new origin will be blocked
    # here until that origin is added — GTM's UI cannot widen this header.
    # tagmanager.google.com + www.google.com + font-src data: are what GTM Preview
    # (Tag Assistant) needs to attach; without them the debug overlay's own scripts
    # and styles are blocked and Tag Assistant just times out with "0 tags found".
    # Google Ads (the container's conversion + remarketing tags) needs
    # googleadservices.com and googleads.g.doubleclick.net in script-src, its
    # collect hosts in connect-src, and td.doubleclick.net in frame-src.
    # Exact hosts only — no *.google.* style wildcards.
    # Yandex Metrica (counter 111820344, loaded by a Custom HTML tag in GTM):
    # the inline loader runs under 'unsafe-inline' but fetches tag.js from
    # mc.yandex.ru, which script-src blocked until these were added. Webvisor
    # needs the mc.yandex.* frames. Do not remove — Metrica is live.
    # https://developers.google.com/tag-platform/security/guides/csp
    # https://yandex.ru/support/metrica/code/install-counter-csp.html
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://tagmanager.google.com https://www.google-analytics.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://mc.yandex.ru https://yastatic.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://www.googletagmanager.com https://tagmanager.google.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; frame-src https://www.google.com https://www.googletagmanager.com https://secure.guestpro.net https://td.doubleclick.net https://www.googleadservices.com https://mc.yandex.ru https://mc.yandex.com; connect-src 'self' https://www.google.com https://google.com https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://stats.g.doubleclick.net https://ad.doubleclick.net https://mc.yandex.ru https://mc.yandex.com; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://secure.guestpro.net; frame-ancestors 'self'"
    # RFC 8288 agent-discovery links to real resources
    Link = "</sitemap.xml>; rel=\"sitemap\", </llms.txt>; rel=\"alternate\"; type=\"text/markdown\""

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Domain aliases → canonical orlowsky.id (preserves path + query via :splat).
# force = true so the rule wins over any path-only rule.
[[redirects]]
  from = "https://orlowskyhotel.com/*"
  to = "https://orlowsky.id/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://orlowskybali.id/*"
  to = "https://orlowsky.id/:splat"
  status = 301
  force = true

# car-rental → car-bike-rental (page renamed; preserve the old indexed URL).
[[redirects]]
  from = "/experiences/car-rental"
  to = "/experiences/car-bike-rental"
  status = 301

[[redirects]]
  from = "/ru/experiences/car-rental"
  to = "/ru/experiences/car-bike-rental"
  status = 301
