[build]
  command = "npm run build"
  publish = "out"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; frame-src https://www.google.com https://secure.guestpro.net; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://secure.guestpro.net; frame-ancestors 'self'"
    # RFC 8288 agent-discovery links to real resources
    Link = "</sitemap.xml>; rel=\"sitemap\", </llms.txt>; rel=\"alternate\"; type=\"text/markdown\""

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Domain aliases → canonical orlowsky.id (preserves path + query via :splat).
# force = true so the rule wins over any path-only rule.
[[redirects]]
  from = "https://orlowskyhotel.com/*"
  to = "https://orlowsky.id/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://orlowskybali.id/*"
  to = "https://orlowsky.id/:splat"
  status = 301
  force = true
