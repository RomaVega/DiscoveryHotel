name: Deploy to GitHub Pages

# Manual trigger only. Netlify is what serves orlowsky.id, and this workflow
# publishes a second, complete copy of the site to GitHub Pages — it ran on
# every push to main for 106 builds, burning Actions minutes on a deploy
# nobody consumed and leaving a duplicate that could silently drift.
#
# It is kept rather than deleted so there is a one-click fallback if Netlify
# is ever down: Actions -> "Deploy to GitHub Pages" -> Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /DiscoveryHotel

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
